# Builds an installable Android APK on GitHub, so no Android tools are needed on your computer.
# Push this project to a GitHub repository, open the Actions tab, run "Build Android APK",
# then download the APK from the finished run's Artifacts section.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders and patch them
        run: bash tool/setup.sh
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
      - name: Unit tests
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.log
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KLASEKO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/klaseko.jks"
            echo "KLASEKO_KEYSTORE=$RUNNER_TEMP/klaseko.jks" >> "$GITHUB_ENV"
            echo "Signing with the permanent key."
          else
            echo "::warning::No signing key is set, so this APK will not install over other builds. See docs/SELLING.md."
          fi
      - name: Build APK
        env:
          KLASEKO_KEY_PASSWORD: ${{ secrets.KLASEKO_KEY_PASSWORD }}
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
      # Posts the important lines of a failed build as annotations, which are readable without signing in.
      - name: Report build errors
        if: failure()
        run: |
          touch errs.txt
          [ -f analyze.log ] && grep -E "^\s*error " analyze.log | head -60 >> errs.txt || true
          [ -f test.log ] && grep -E "\[E\]|Expected:|Actual:|Which:|Error:|error:" test.log | head -60 >> errs.txt || true
          [ -f build.log ] && grep -i -E "error|what went wrong|failed|exception|could not|cannot|unresolved|requires|> " build.log | grep -v "^\s*$" | tail -90 >> errs.txt || true
          [ -s errs.txt ] || exit 0
          split -l 30 errs.txt part_
          for f in part_*; do
            msg=$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build APK log ($f)::$msg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: klaseko-apk
          path: build/app/outputs/flutter-apk/app-release.apk
