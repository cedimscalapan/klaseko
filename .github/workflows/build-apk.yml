# Builds an installable Android APK on GitHub, so no Android tools are needed on your computer.
# Push this project to a GitHub repository, open the Actions tab, run "Build Android APK",
# then download the APK from the finished run's Artifacts section.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders and patch them
        run: bash tool/setup.sh
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit tests
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: klaseko-apk
          path: build/app/outputs/flutter-apk/app-release.apk
