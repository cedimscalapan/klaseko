name: klaseko
description: KlaseKo - offline class records, exam maker and paper checker for DepEd teachers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Encrypted on-device database (SQLite + SQLCipher). Works 100% offline.
  sqflite_sqlcipher: ^3.1.0+1
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  # Checks KlaseKo Plus activation codes offline
  cryptography: ^2.7.0
  path_provider: ^2.1.4
  path: ^1.9.0
  # Printing and documents
  pdf: ^3.11.1
  printing: ^5.13.2
  excel: ^4.0.6
  # Paper checking
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.2.0
  # Files
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  # Quiz import: Word files (zip) and on-device text recognition for photos and PDF pages
  archive: ^3.6.1
  google_mlkit_text_recognition: '>=0.13.0 <0.18.0'
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  # Lexend (SIL Open Font License, assets/fonts/OFL.txt) is designed for easy reading; bundled so it works offline.
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lexend-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lexend-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lexend-ExtraBold.ttf
          weight: 800
