name: klaseko
description: KlaseKo - offline class records, exam maker and paper checker for DepEd teachers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Encrypted on-device database (SQLite + SQLCipher). Works 100% offline.
  sqflite_sqlcipher: ^3.1.0+1
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  path: ^1.9.0
  # Printing and documents
  pdf: ^3.11.1
  printing: ^5.13.2
  excel: ^4.0.6
  # Paper checking
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.2.0
  # Files
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
